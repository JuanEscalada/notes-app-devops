
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: notes-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: notes-web

  template:
    metadata:
      labels:
        app: notes-web

    spec:
      containers:
        - name: nginx
          image: ghcr.io/juanescalada/notes-web@sha256:5b3401b473d32161a662c37bddb07e1eb74112ace99846c99545a9a81b50ae27
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

